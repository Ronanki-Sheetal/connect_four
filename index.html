<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect Four</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <p class="eyebrow">Classic two-player game</p>
    <h1>Connect Four</h1>
    <p id="status" class="status">Red's turn</p>

    <div class="board-wrap">
      <section id="board" class="board" aria-label="Connect Four board"></section>
      <p id="winnerMessage" class="winner-message" aria-live="assertive" hidden></p>
    </div>

    <button id="resetButton" class="reset-button" type="button">New game</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
